apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
---
# lee username/password del secreto que RDS administra y construye el Secret de K8s "ticket-api-db" con las 5 variables que usa la app.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ticket-api-db
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: ticket-api-db
    creationPolicy: Owner
    template:
      data:
        DB_HOST: "${DB_HOST}"
        DB_PORT: "5432"
        DB_NAME: concertpass
        DB_USER: "{{ .username }}"
        DB_PASSWORD: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: "${DB_SECRET_ARN}"
        property: username
    - secretKey: password
      remoteRef:
        key: "${DB_SECRET_ARN}"
        property: password